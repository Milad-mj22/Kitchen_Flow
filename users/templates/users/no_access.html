<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دسترسی غیرمجاز</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body {
            background: linear-gradient(to right, #e5ff00, #3d4b01);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
        }
        .icon {
            font-size: 80px;
            color: #ff4b5c;
        }
        .btn-custom {
            background-color: #ff4b5c;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            transition: 0.3s;
        }
        .btn-custom:hover {
            background-color: #e63946;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card text-center">
            <i class="fas fa-exclamation-triangle icon"></i>
            <h1 class="mt-3">دسترسی غیرمجاز</h1>
            <p>شما مجاز به مشاهده این صفحه نیستید.</p>
            <a href="/" class="btn btn-custom text-white">بازگشت به صفحه اصلی</a>
        </div>
    </div>
</body>
</html>
